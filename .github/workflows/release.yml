name: release

# CI 负责构建并生成 Release 草稿,公开发布由仓库维护者人工确认后点 Publish:
#   1) 推送 v* tag:CI 构建三平台安装包并生成草稿 Release
#   2) Actions 页面手动 Run workflow:填版本号(留空取 package.json),
#      CI 校验版本、创建 tag、构建三平台并生成草稿,不用本地 git 命令
# 手动触发可勾 dry_run 只验证打包链路、不创建 Release。
# 版本号必须与 package.json 一致;已公开发布过的版本会被拦截,避免覆盖。
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '要发布的版本号(不带 v)。留空则取 package.json 的 version'
        required: false
        type: string
      dry_run:
        description: '只构建验证,不创建或发布 Release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# 同一 tag / 分支的触发串行,避免并发构建互相覆盖 Release 资产
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  meta:
    name: resolve version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      # tag 与手动触发统一在这里算出版本号并校验,构建 job 依赖它,
      # 版本不对就在几秒内失败,不必等三平台打包跑完。
      - name: Resolve version
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          PKG=$(node -p "require('./package.json').version")
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            VERSION="${INPUT_VERSION:-$PKG}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          if [ "$VERSION" != "$PKG" ]; then
            echo "::error::版本号 ($VERSION) 与 package.json ($PKG) 不一致;请先修改 package.json"
            exit 1
          fi
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::版本号格式不合法: $VERSION"
            exit 1
          fi
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "版本校验通过,准备发布 $TAG"

      # 防止把已公开发布的 Release 覆盖或误改回草稿(例如重跑旧 tag 的工作流);
      # 草稿则允许补齐资产后继续保持草稿,等待人工发布。
      - name: Guard published release
        if: ${{ inputs.dry_run != true }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if DRAFT=$(gh release view "$TAG" --json isDraft -q .isDraft 2>/dev/null); then
            if [ "$DRAFT" = "false" ]; then
              echo "::error::$TAG 已公开发布过,请先 bump package.json 版本再发版"
              exit 1
            fi
            echo "发现 $TAG 的草稿 Release,本轮会补齐资产并保持草稿,等待人工发布"
          else
            echo "$TAG 尚无 Release,将创建 tag 并生成草稿"
          fi

  build:
    name: build (${{ matrix.os }})
    needs: meta
    strategy:
      # 某个平台失败时,其余平台的包仍然产出,不至于全军覆没
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build:win
            artifacts: release/*.exe
          - os: macos-latest
            script: build:mac
            artifacts: release/*.dmg
          - os: ubuntu-latest
            script: build:linux
            artifacts: |
              release/*.AppImage
              release/*.deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: npm ci

      - name: Build installer
        # --publish never:发布交给下面的 release job,避免 electron-builder
        # 在 CI 中自行上传而与之冲突
        run: npm run ${{ matrix.script }} -- --publish never
        env:
          # 未配置签名证书。不关掉自动查找的话,macOS 上会因找不到签名身份而失败
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: create release draft
    needs: [meta, build]
    if: ${{ inputs.dry_run != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: installer-*
          merge-multiple: true

      - name: List artifacts
        run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          # 手动触发时 tag 可能还不存在,target_commitish 让 action 从当前提交创建它;
          # 已有 tag 时则复用,不会移动 tag 指向。
          tag_name: ${{ needs.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          prerelease: ${{ contains(needs.meta.outputs.tag, '-') }}
          # 只生成草稿,对外不可见;仓库维护者核对资产后手动点 Publish 才公开。
          # 重跑同一 tag 时也只是更新这份草稿,不会误发布。
          draft: true
